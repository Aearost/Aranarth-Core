# Mob head drop configuration for the Beheading incantation
#
# Textures are fetched automatically from minecraft-heads.com at server startup.
#
# Fields per entry:
#   name:        Display name of the dropped head (supports & color codes)
#   texture:     (optional) Hardcoded base64 texture override - paste from minecraft-heads.com
#                Leave empty to use automatic API lookup.
#   search-name: (optional) Override the API search term (default: entity type in Title Case)
#                Use this to pin to a more specific head, e.g. "Sheep Minecraft" instead of "Sheep"
#
# Drop rates with Beheading:
#   Level 1: 10% (1/10)
#   Level 2: 25% (1/4)
#   Level 3: 50% (1/2)
#   No Beheading: 0% (mob heads never drop without Beheading)
#   Wither Skeleton: L1=5%, L2=10%, L3=20% (kept rare to match vanilla skull rarity)
#
# The entity type keys must match Bukkit EntityType enum names exactly.
# Vanilla head blocks (Creeper, Zombie, Skeleton, Wither Skeleton, Piglin, Ender Dragon)
# are handled separately and do not need entries here.

