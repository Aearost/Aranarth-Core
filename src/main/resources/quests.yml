# Aranarth quests (#450). Generated from the reviewed design; edit values here to rebalance.
# Rank arrays: [Peasant, Esquire, Knight, Baron, Count, Duke, Prince, King, Emperor]. 0 = not offered at that rank.
# Amounts roll daily 0.75x-1.25x and weekly 1.0x-1.5x (unless fixed), and the reward follows the roll.
# Targets: material/entity/biome/structure names; * is a wildcard and a leading ! excludes.
# 'weight' makes a quest more likely to be picked than others (default 1).
# Variant 'level' is the job level needed, 'alchemy_tier' the mcMMO Alchemy tier, 'month' limits it to one Aranarth month.

settings:
  daily-roll: [0.75, 1.25]
  weekly-roll: [1.0, 1.5]
