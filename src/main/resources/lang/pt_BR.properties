perks.section_intro_content=&5&lPerks\n\n&rOs perks são funcionalidades de qualidade de\nvida disponíveis para jogadores de rank &dSaint&r.\n\nOs ranks Saint são níveis de doação separados\ndos ranks de jogo padrão:\n- &3Acolyte&r (Saint I) - Perks básicos\n- &6Disciple&r (Saint II) - Perks avançados\n- &4Seraph&r (Saint III) - Perks premium\n\nOs perks também podem ser comprados individualmente\nna loja de Aranarth via &a/store&r.
perks.section_blacklist_content=&7&lLista Negra &8[&3Acolyte+&8]\n\n&rA Lista Negra permite-te definir até 3\npresets de itens. Quando eventos de\nauto-venda disparam, os itens na tua\nlista negra são automaticamente separados.\n\nModos da Lista Negra:\n- &oIgnorar&r - manter itens da lista\n- &oDeitar Fora&r - descartar itens da lista\n- &oDesativado&r - desativar o filtro\n\nGere a tua lista negra com &a/blacklist&r.
perks.section_tables_content=&7&lMesas &8[&3Acolyte+&8]\n\n&rO perk Mesas desbloqueia o acesso à\nMesa de Flechas e ao Tear.\n\nA &oMesa de Flechas&r permite-te fabricar\ntipos especiais de flechas não disponíveis\natravés da fabricação padrão.\n\nVê o guia de Mecânicas para detalhes\ncompletos sobre receitas e uso.
perks.section_cosmetics_content=&d&lCosméticos &8[&3Acolyte+&8]\n\n&rOs perks cosméticos permitem-te personalizar\na tua aparência e efeitos de partículas.\n\nCosméticos disponíveis:\n- &oRastros de partículas&r - seguem-te ao moveres\n- &oEfeitos de partículas&r - auras ambientais\n  e efeitos visuais à volta do teu personagem\n\nAcede aos teus cosméticos em &a/cosmetics&r.
perks.section_shulkerassist_content=&5&lAssistente Shulker &8[&6Disciple+&8]\n\n&rO Assistente Shulker permite-te aceder\nao conteúdo de uma Caixa Shulker diretamente\nno inventário sem a colocar no chão.\n\nClique direito numa Caixa Shulker no teu\ninventário para abrí-la e interagir\ncom o conteúdo diretamente.
perks.section_invisiblearmor_content=&7&lArmadura Invisível &8[&6Disciple+&8]\n\n&rA Armadura Invisível permite-te esconder\na armadura equipada de outros jogadores.\n\nMantens todos os bónus de stats da armadura\nenquanto aparece invisível. Perfeito para\nmostrar a tua skin sem sacrificar proteção.
perks.section_hexcolors_content=&#5555ff&lCores Hex &8[&6Disciple+&8]\n\n&rCores Hex desbloqueia a capacidade de usar\ncódigos de cor hexadecimais no chat e\nno teu apelido.\n\nFormato: &o&#RRGGBB&r seguido do teu texto.\n\nCombina com &a/nick&r (Duque+) para dar\nao teu nome um gradiente totalmente\npersonalizado.
perks.section_inventoryassist_content=&a&lAssistente de Inventário &8[&4Seraph+&8]\n\n&rO Assistente de Inventário adiciona ordenação\nintelgente e auto-depósito ao teu inventário.\n\nO auto-depósito envia itens correspondentes\ndiretamente para contentores próximos\nquando regressas de minerar ou agricutar.\n\nAcede às definições com &a/inventoryassist&r.
perks.section_compressor_content=&7&lCompressor &8[&4Seraph+&8]\n\n&rO Compressor converte automaticamente\ndrops de itens empilháveis nos seus\nequivalentes em blocos ao coletá-los.\n\nPor exemplo, 9 lingotes de ferro serão\nautomaticamente comprimidos num\nbloco de ferro no teu inventário.\n\nAtiva/desativa nas definições de inventário.
perks.section_randomizer_content=&6&lRandomizador &8[&4Seraph+&8]\n\n&rO Randomizador é uma funcionalidade de loot\nespecial que aplica bónus aleatórios\naos itens que recolhes no mundo.\n\nModificadores baseados em probabilidade podem\nmelhorar drops, dando loot bónus ocasional\nouqualidade de item melhorada ao colher\nou derrotar mobs.\n\nAtiva/desativa nas definições de inventário.
