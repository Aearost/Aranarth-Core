bending.section_avatar_label=&6Avatar
bending.section_intro_content=&9&lBending\n\n&rO Bending é um sistema de combate e exploração\ninspurado em Avatar: A Lenda de Aang.\n\nEscolhe um de quatro elementos via &a/b choose&r.\nVincula habilidades à barra de atalhos com &a/b bind&r.\n\nO teu elemento e habilidades persistem entre sessões.\nUsa &a/b display&r para ver as habilidades atuais.
bending.section_elements_content=&9&lOs Quatro Elementos\n\n- &9&lAirbending&r - Mobilidade e evasão.\n  Alta velocidade, knockback, utilidade espiritual\n\n- &3&lWaterbending&r - Cura e controlo.\n  AoE, manipulação de gelo, plantbending\n\n- &2&lEarthbending&r - Força e resistência.\n  Projéteis, controlo de terreno, lavabending\n\n- &c&lFirebending&r - Agressão e pressão.\n  Alto dano, relâmpagos, explosões\n\nEscolhe o teu elemento com &a/b choose&r.
bending.section_ranklocked_content=&e&lHabilidades de Rank & Sub-Elementos\n\n&rAlgumas habilidades requerem ranks específicos.\nRanks mais altos desbloqueiam movimentos mais fortes\ne maior domínio elemental.\n\nOs sub-elementos tornam-se disponíveis em ranks mais altos:\n- &9Ar&r: Som, Espiritual/Astral\n- &3Água&r: Bloodbending, Plantbending\n- &2Terra&r: Metalbending, Lavabending\n- &c Fogo&r: Combustão, Relâmpago\n\nUsa &a/ranks&r para ver o teu rank e habilidades.
bending.section_subelements_content=&7&lDetalhes dos Sub-Elementos\n\n&rOs sub-elementos expandem o teu arsenal:\n\n- &9Som&r - Ondas de choque e sonar\n- &9Espiritual&r / &9Projeção Astral&r - Movimento no reino espiritual\n- &3Bloodbending&r - Controlo de alvos vivos\n- &3Plantbending&r - Controlo de trepadeiras e folhagem\n- &2Metalbending&r - Manipular blocos metálicos\n- &2Lavabending&r - Moldar e lançar lava\n- &cCombustão&r - Raio de bending explosivo\n- &cRelâmpago&r - Golpe de relâmpago de alto dano\n\nSub-elementos também desbloqueiam durante Eventos Mundiais.
bending.section_mounts_content=&a&lMonturas de Bending\n\n&rCada elemento tem uma montura única.\nInvoca a tua com &a/mount&r.\n\nMonturas por elemento:\n- &9Airbending&r: Happy Ghast\n- &3Waterbending&r: Urso Polar\n- &2Earthbending&r: Sniffer\n- &cFirebending&r: Ravager\n\nAs monturas ganham XP com o uso de bending\ne sobem de nível ao longo do tempo.
bending.section_restrictions_content=&c&lRestrições de Bending\n\n&rO bending está sujeito a certas restrições\nque variam por localização e bandeiras do Dominio.\n\nO bending pode ser desativado dentro de um Dominio\nou de um dos seus postos avançados através da\nbandeira de bending em &a/dominion flags&r.\n\nAs bandeiras de bending dos postos avançados são\nconfiguradas independentemente do Dominio principal.\n\nVê o guia de Bandeiras do Dominio para detalhes:
bending.section_combat_content=&4&lBending em Combate\n\n&rO dano de bending escala com o teu rank:\n- &7Camponês: &e1.0x\n- &7Escudeiro: &e1.05x &7| Cavaleiro: &e1.15x\n- &5Barão: &e1.3x &7| Conde: &e1.5x\n- &6Duque: &e1.75x &7| Príncipe: &e2.0x\n- &9Rei: &e2.25x &7| Imperador: &e2.5x\n\nDurante Eventos Mundiais, o elemento relevante\nrecebe um bónus de dano adicional.
bending.section_avatar_content=&6&lO Avatar\n\n&rO Avatar é uma designação especial\ndetida por um jogador de cada vez.\nO Avatar pode dominar os quatro elementos.\n\nA sucessão do Avatar segue um ciclo natural.\nQuando o Avatar atual sai do servidor\nou abdica, um novo Avatar é escolhido.\n\nCada forma de Avatar traz forças diferentes.\nOs poderes do Avatar são significativamente\nmais fortes que os de um dobrador padrão.
