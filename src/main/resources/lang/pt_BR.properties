calendar.guide_title=&8      - - - &6&lO Calendário &8- - -
calendar.guide_select_month=&7&oSeleciona um mês para aprenderes sobre ele:
calendar.guide_back=&8[&eVoltar ao Calendário&8]
calendar.ignivor_name=&#ffe082Ignivór
calendar.ignivor_subtitle=&oO Novo Fogo
calendar.ignivor_desc=O mês de Ignivór representa o início\ndo novo ano. Os jogadores recebem\nRegeneração I passiva, bem como Sorte passiva. Embora\ntempestades de neve ainda sejam possíveis, são\nmuito mais raras, e a neve começa a derreter.
calendar.aquinvor_name=&3Aquinvór
calendar.aquinvor_subtitle=&oO Húmido
calendar.aquinvor_desc=O mês de Aquinvór marca a primavera.\nOs jogadores recebem os efeitos passivos de\nGraça dos Golfinhos e Respiração Aquática. A chuva\ncai com mais frequência e dura mais do que\nnoutros meses, derretendo a neve restante.
calendar.ventivor_name=&#d1e5f4Ventivór
calendar.ventivor_subtitle=&oO Zéfiro
calendar.ventivor_desc=O mês de Ventivór traz vento a favor.\nOuve-se o som do vento cortando o ar,\ngerando Brisas ocasionalmente,\nconcedendo o efeito passivo de Velocidade I.
calendar.florivor_name=&#FDA4BAFlorivór
calendar.florivor_subtitle=&oO Florescimento
calendar.florivor_desc=O cheiro de pétalas de flores dispersa-se pelo\nvento, surgindo aleatoriamente. Além disso,\nos eyeblossoms podem ser usados para preparar Poções\nde Ordem e Caos usando como base uma\npoção Mundana.
calendar.aestivor_name=&eAestivór
calendar.aestivor_subtitle=&oO Eletrificado
calendar.aestivor_desc=O mês de Aestivór está repleto de\ntempestades violentas. Os céus trovoarão\nmuito mais frequentemente do que noutros meses.\nTambém há 20% de probabilidade de os creepers\naparecerem como a variante carregada.
calendar.calorvor_name=&6Calorvór
calendar.calorvor_subtitle=&oO Aquecimento
calendar.calorvor_desc=O mês de Calorvór inicia o verão.\nOs animais bebés crescem mais rapidamente, e\ntêm 50% de probabilidade de nascer como gémeos.
calendar.ardorvor_name=&#ff4500Ardorvór
calendar.ardorvor_subtitle=&oO Inflamado
calendar.ardorvor_desc=O mês de Ardorvór é o mês das chamas.\nTodas as fontes de fogo causam mais dano, e\nráfagas aleatórias de fraqueza e fadiga de mineração\nsão sentidas sob o sol abrasador. Apenas\no calor diurno aplica estes efeitos.
calendar.solarvor_name=&#BD5745Solarvór
calendar.solarvor_subtitle=&oO Frutífero
calendar.solarvor_desc=O mês de Solarvór favorece a colheita\nde maçãs. Taxas aumentadas de drop de maçãs, e\nfrequentes drops de &6Fragmentos de Maçã Divina &r- haverá\nmuito para todos.
calendar.follivor_name=&#a17100Follivór
calendar.follivor_subtitle=&oO Lenhado
calendar.follivor_desc=O mês de Follivór inicia o\noutono. As árvores fornecem mais EXP e\ndrops adicionais de troncos, e as sementes crescem\nmais rapidamente.
calendar.strigavor_name=&#8a00c2Strigavór
calendar.strigavor_subtitle=&oO Maligno
calendar.strigavor_desc=O mês de Strigavór é para a bruxaria,\nfornecendo efeitos positivos aumentados durante\no dia, e efeitos negativos aumentados durante\na noite. Também concede 25% de probabilidade de\nduplicar uma poção.
calendar.faunivor_name=&#5b0001Faunivór
calendar.faunivor_subtitle=&oA Caça
calendar.faunivor_desc=O mês de Faunivór encoraja um pouco de\nviolência. As armas causam mais dano,\ne as taxas de drop de mobs serão duplicadas para\ntanto carne como produtos animais.
calendar.umbravor_name=&#2B3856Umbravór
calendar.umbravor_subtitle=&oO Sombrio
calendar.umbravor_desc=O mês de Umbravór marca o início\ndo inverno. Há uma baixa probabilidade de\ntempestades de neve mundiais, e as colheitas já não\nsão colhidas com tanta eficiência.
calendar.glacivor_name=&#DBE9FAGlacivór
calendar.glacivor_subtitle=&oA Geada
calendar.glacivor_desc=O mês de Glacivór faz arrepios percorrerem\na sua espinha. Serás abrandado no teu\ncaminho, e a água começa a congelar nos rios\ne no mar. Permanecer ao ar livre levará\na geladuras.
calendar.frigorvor_name=&#79BAECFrigorvór
calendar.frigorvor_subtitle=&oO Congelado
calendar.frigorvor_desc=O mês de Frigorvór traz as nevadas mais intensas.\nOs seus movimentos serão abrandados ainda\nmais, assim como as taxas de crescimento das suas colheitas.\nAs geladuras atacam mais rapidamente quando a noite cai.
calendar.obscurvor_name=&#2C041CObscurvór
calendar.obscurvor_subtitle=&oA Escuridão
calendar.obscurvor_desc=O mês de Obscurvór é o mês do descanso.\nA lentidão do inverno persiste, com mais\nagressividade dos fantasmas, e um número crescente\nde jogadores a dormir para saltar a noite.\nO frio ainda morde quem fica lá fora\ndemasiado tempo.
