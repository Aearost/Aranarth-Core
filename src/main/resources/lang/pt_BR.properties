mechanics.section_fletchingtable_label=&7Mesa de Flechas
mechanics.section_dragonsbreath_label=&5Sopro do Dragão
mechanics.section_autoplant_label=&aSemeadura Automática
mechanics.section_fletchingtable_content=&7&lMesa de Flechas &8[&3Perk Mesas Acolyte&8]\n\n&rA Mesa de Flechas desbloqueia acesso a\nfabricação especial de flechas não disponível\natravés da mesa de fabricação padrão.\n\nPara a usar, coloca uma Mesa de Flechas\ne interage com ela. O perk Mesas\n(rank Saint Acolyte ou comprado\nseparadamente) é necessário.\n\nTipos de flechas disponíveis via Mesa de Flechas\nproporcionam efeitos de combate únicos.
mechanics.section_dragonsbreath_content=&5&lColheita de Sopro do Dragão\n\n&rO Sopro do Dragão pode ser colhido do\nDragão Ender usando um combustível especial.\n\nPara colher:\n1. Cria um &5Diamante de Chorus&r como combustível\n2. Coloca-o dentro de um &odispensador\n   alimentado por redstone&r voltado para o Dragão\n3. O dispensador dispara e coleta\n   o Sopro do Dragão\n\nValores de combustível:\n- &5Diamante de Chorus&r: &e8 usos\n- &5Diamante de Chorus&r (com redstone): &e16 usos\n\nEsta é a única forma de obter Sopro do\nDragão em Aranarth.
mechanics.section_autoplant_content=&a&lSemeadura Automática de Culturas\n\n&rAo colher culturas maduras, podes\nreplantá-las automaticamente.\n\nComo funciona:\n- &oAgachar&r enquanto quebras uma cultura\n  totalmente crescida para ativar\n- A cultura é colhida normalmente\n- As sementes são automaticamente replantadas\n  no mesmo local\n- A maturidade reinicia para 0\n\nFunciona em todas as culturas plantáveis padrão\ne não consome sementes extra do inventário.
mechanics.section_croptrample_label=&7Terra Agricola
mechanics.section_croptrample_content=&7&lPrevenção de Pisoteamento\n\n&rA terra agricola não pode ser\npiseada em Aranarth. Nem jogadores\nnem mobs conseguem converter solo\narado de volta em terra ao caminhar\nsobre ele.\n\nIsso torna a agricultura mais fiável\ne previne danos acidentais ou\nintencionais às tuas culturas.
mechanics.section_specialarrows_label=&7Flechas Especiais
mechanics.section_specialarrows_content=&7&lFlechas Especiais\n\n&rAs flechas especiais são fabricadas\nna Mesa de Flechas usando pontas\npersonalizadas. Cada tipo causa\ndano bónus e despoleta um efeito\núnico ao acertar.\n\nFlechas de Ferro e Ouro causam dano\nextra. Ametista causa mais dano,\nObsidiana causa dano pesado, e\nDiamante é o mais poderoso de todos.\n\nFlechas de Dragão libertam uma nuvem.\nFlechas Explosivas detonam no impacto.\nFlechas de Raio invocam um relâmpago.\nFlechas Enraizantes imobilizam o alvo.\nFlechas de Rajada afastam o alvo.
mechanics.section_quiver_label=&7Aljava
mechanics.section_quiver_content=&7&lAljava\n\n&rUma Aljava na mão secundária guarda\num fornecimento de flechas. Ao\ndisparar com um arco, as flechas são\nautomaticamente consumidas da aljava\nem vez do inventário.\n\nIsso liberta espaço no inventário e\ntorna prático transportar grandes\nquantidades de flechas. A aljava\nfunciona com todos os arcos que\nnão têm o encantamento Infinidade.
mechanics.section_chestsort_label=&7Ordenar Baús
mechanics.section_chestsort_content=&7&lOrdenação de Baús\n\n&rAgachar ao abrir qualquer contentor\nordena automaticamente todos os\nitens dentro por categoria.\n\nOs itens são agrupados em categorias\nincluindo minérios, produtos agrícolas,\ncomida, armas, armadura e mais.\nA ordenação é instantânea e gratuita.\n\nFunciona em baús, barris, caixas\nShulker e outros contentores.
mechanics.section_autolock_label=&7Auto-Trancamento
mechanics.section_autolock_content=&7&lAuto-Trancamento de Contentores\n\n&rQuando colocas um baú, barril,\ncaixa Shulker ou outro contentor,\nele é automaticamente trancado para\nti. Outros jogadores não podem\nabrí-lo sem a tua permissão.\n\nPodes adicionar jogadores de confiança\npara lhes conceder acesso. Isto\nsegura o teu armazenamento dentro\ne fora do teu Domínio.
mechanics.section_bonemealwood_label=&7Farinha de Osso em Madeira
mechanics.section_bonemealwood_content=&7&lFarinha de Osso em Troncos Descascados\n\n&rAplicar farinha de osso num tronco\nou haste descascada restaura a casca,\nconvertendo-o de volta num tronco\nou haste normal.\n\nAplicar farinha de osso num tronco\nnormal converte-o num bloco de\nmadeira com casca em todos os seis\nlados.\n\nIsso permite reverter erros ao\ndescascar troncos ou fabricar\nblocos de madeira com mais liberdade.
mechanics.section_cauldronbottles_label=&7Caldeirões
mechanics.section_cauldronbottles_content=&7&lEnchimento de Garrafas em Caldeirão\n\n&rEncher garrafas de vidro a partir\nde um caldeirão de água não diminui\no nível de água do caldeirão.\n\nOs caldeirões funcionam como fonte\ninfindável de água para encher\ngarrafas. Isso torna a criação de\nGarrafas de Água de Arremesso e\noutras poções prática sem precisar\nde reabastecer o caldeirão.
mechanics.section_goathorns_label=&7Cornos de Cabra
mechanics.section_goathorns_content=&7&lCornos de Cabra\n\n&rOs cornos de cabra em Aranarth\ntêm habilidades personalizadas\nconsoante o tipo.\n\nGritar concede velocidade e salto.\nProcurar chama os defensores do teu Domínio.\nSentir concede impulso de força.\nCantar concede Regeneração II.\nAdmirar invoca golems de ferro, lobos\nou cavalos. Resistir remove todos os\nefeitos negativos.\n\nApós Procurar, recebes 1,5x de dano\ndurante 30 segundos.
mechanics.section_homepads_label=&7Homepads
mechanics.section_homepads_content=&7&lHomepads\n\n&rAs placas de pressão pesadas podem\nser usadas como Homepads - plataformas\nde teletransporte ligadas umas às\noutras. Pisar um Homepad teletransporta-te\npara o destino ligado.\n\nOs Homepads podem ser colocados em\nqualquer lugar e são uma forma\nconveniente de criar rotas de viagem\nrápida dentro do teu Domínio ou base.
