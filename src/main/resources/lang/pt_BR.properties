aranarthium.section_intro_content=&oO &lReino de Aranarth&r&o exala uma energia sagrada,\ninfundindo os seus minérios com um pouco de magia.\n\n&l&nDepósitos de Minério\n&rOs depósitos de minério caem do cobre, ferro, ouro,\nquartzo do Nether, lápis, redstone, diamante,\ne minérios de esmeralda, a taxas muito baixas.
aranarthium.section_ingots_content=&l&nAranarthium\n&rAo fabricar todos os 8 depósitos de minério juntamente com\num lingote de netherite, cria-se um &lLingote de Aranarthium&r.\n\nEste lingote é usado como base para fabricar todos\nos &oLingotes de Aranarthium Melhorados&r, que são aplicados\na armadura de netherite e concedem habilidades especiais.
aranarthium.section_elytra_content=&7&lÉlitros de Netherite\n&rAo combinar um lingote de netherite e élitros\nnuma bigorna, os Élitros de Netherite fornecem os\npontos de armadura de um peitoral de netherite.\n\nVocê pode também melhorá-los com um lingote melhorado\nà sua escolha, fornecendo os efeitos do conjunto completo.
aranarthium.section_aquatic_content=&#AEEEEE&lAranarthium Aquático&r\n\n&rFornece &oGraça dos Golfinhos&r, &oPoder do Conduto&r,\n& 2x drops de pesca. Se estiver a chover ou na água,\ntambém fornece &oVelocidade III &rand &oForça II.\n\nAumenta o dano do &lTridente&r, e impede todo o\nfoco dos Guardiões.
aranarthium.section_ardent_content=&#696969&lAranarthium Ardente&r\n\n&rFornece ao utilizador os efeitos de estado de\n&oForça III &rand &oResistência II,&r e aumenta\nos drops de mobs.\n\nAdicionalmente aumenta o dano com &lEspadas.
aranarthium.section_dwarven_content=&#FFEE8C&lAranarthium Anão&r\n\n&rFornece ao utilizador os efeitos de estado de\n&oVisão Noturna&r, e taxas melhoradas de drop\nde minérios e depósitos.\n\nAdicionalmente aumenta o dano com\n&lMachados &rand &lMaças.
aranarthium.section_elven_content=&#3F704D&lAranarthium Élfico&r\n\n&rFornece ao utilizador os efeitos de estado de\n&oVelocidade III, Salto II,&r e uma linha extra\nde corações. Também aumenta as colheitas de culturas.\n\nAdicionalmente aumenta o dano com\n&lArcos &rand &lLanças.
aranarthium.section_fae_content=&#FBA0E3&lAranarthium Fae&r\n&rFornece &oVelocidade I &rand &oForça I&r, com efeitos\nmelhorados em florestas e ilhas de cogumelos.\n\n&rOs limites de empilhamento de efeitos de poção são aumentados,\ne os cogumelos tornam-se comestíveis e fornecem buffs.\nOs fantasmas já não te irão visar.
aranarthium.section_scorched_content=&#ff4500&lAranarthium Chamuscado&r\n&rFornece ao utilizador &oResistência ao Fogo&r e\n&oResistência I&r, e se estiver no Nether, também\nfornecerá &oVelocidade III &rand &oForça II.\n\n&rAdicionalmente faz com que o dano causado incendeie\nos alvos, e impede ser visado por\nPiglins ou Hoglins.
aranarthium.section_soulbound_content=&#9400D3&lAranarthium Alma-Ligada&r\n\n&rNão fornece ao utilizador efeitos de estado especiais,\nmas sim a bênção da\nvida eterna.\n\nO utilizador terá o seu inventário completo\npersistido após a morte.
