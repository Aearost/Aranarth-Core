ranks.section_intro_content=&6&lRanks\n\n&rAranarth tem 9 níveis de rank de\n&aCamponês&r a &4Imperador&r.\n\nOs ranks são obtidos pagando dinheiro e\ncumprindo requisitos de mcMMO.\n\nUsa &a/ranks&r para ver todos os níveis e\no teu progresso para o próximo rank.
ranks.section_tiers_content=&6&lNíveis de Rank\n\n&aCamponês&r - Rank inicial (grátis)\n&dEscudeiro&r - $1.000 | 100 mcMMO geral\n&7Cavaleiro&r - $5.000 | 350 geral\n&5Barão/essa&r - $15.000 | 500 + 150/categoria\n&8Conde/essa&r - $50.000 | 1.000 + 375/categoria\n&6Duque/esa&r - $125.000 | 2.500 + 750/categoria\n&bPríncipe/esa&r - $500.000 | 7.500 + 1.250/cat\n&9Rei/Rainha&r - $2.500.000 | 12.500 + 2.500/cat\n&4Imperador/riz&r - $10.000.000 | 25.000 + 5.000/cat\n\nCada rank tem variantes masculinas e femininas.\nEscolhe a tua em &a/gender&r.
ranks.section_mcmmo_content=&7&lRequisitos de mcMMO\n\n&rDois limites de mcMMO devem ser cumpridos\npara a maioria dos ranks a partir de Barão:\n\n1. &oNível de Poder Geral&r - a soma de todos\n   os teus níveis de competência de mcMMO\n\n2. &oNível por Categoria&r - cada uma das três\n   categorias (Recolha, Combate e\n   Miscelânea) deve cumprir\n   o nível requerido individualmente\n\nVerifica as tuas estatísticas com &a/mcstats&r.
ranks.section_pronouns_content=&7&lPronomes\n\n&rPodes definir os teus pronomes em Aranarth\npara personalizar como o servidor se refere a ti.\n\nUsa &a/pronouns&r para abrir o seletor\nde pronomes. Os teus pronomes aparecem\nem várias mensagens do servidor como\nnotificações de morte, resumos de estatísticas\ne outros anúncios.\n\nAtualmente suportados: &oEle/Dele&r, &oEla/Dela&r,\n&oElus/Delus&r.
ranks.section_unlocks_content=&6&lO que os Ranks Desbloqueiam\n\n&rCada rank fornece perks adicionais como\ncasas extra, slots de aljava, slots de poções,\nslots de emprego, comandos de teleporte,\nslots de loja e mais dano de bending.\n\nLimites principais:\n- &dEscudeiro&r: /mount, /dominion home\n- &7Cavaleiro&r: /back, /trash\n- &5Barão&r: /dominion create, 3 lojas\n- &6Duque&r: /nick, alcunha no Discord\n- &9Rei&r: /nick (cor), /toggle chat\n- &4Imperador&r: #server-chat no Discord\n\nRanks Saint (Acolyte, Disciple, Seraph)\ndesbloqueiam perks de doador adicionais:
ranks.section_abilities_content=&9&lHabilidades de Bending por Rank\n\n&rRanks mais altos desbloqueiam habilidades\nmais poderosas e sub-elementos.\n\nExemplos por elemento:\n- &9Ar&r: Habilidades como Air Scooter\n  ou Projeção Espiritual em ranks mais altos\n- &3Água&r: Habilidades como Torrent\n  ou Bloodbending em ranks mais altos\n- &2Terra&r: Habilidades como Catapult\n  ou Lavabending em ranks mais altos\n- &c Fogo&r: Habilidades como Blaze\n  ou Relâmpago em ranks mais altos\n\nUsa &a/b display&r e &a/ranks&r para ver\no que tens disponível.
