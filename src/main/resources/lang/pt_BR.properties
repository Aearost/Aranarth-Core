essences.section_overview_content1=&lEncantações&r são o próprio sistema de\nencantamento de Aranarth, concedendo bónus poderosos\na armas e ferramentas além do que os\nencantamentos padrão oferecem.\n\nSão obtidas exclusivamente das\ncaixas encontradas em &6/crates&r.
essences.section_overview_content2=Existem 6 Encantações diferentes no\nReino de Aranarth:\n- &#5b0001&lDecapitação&r\n- &a&lRoubo de Vida&r\n- &6&lAbundante&r\n- &8&lMagnetismo&r\n- &#8090a5&lResiliência&r\n- &5&lPreservação&r\n\nNota que apenas &ouma encantação&r pode ser\naplicada por item. Algumas requerem adicionalmente\num &6Lingote de Aranarthium&r.
essences.section_applying_content=&lAplicar Encantações&r\nLarga o item de encantação na arma ou\nferramenta a que desejares aplicá-la. Após um breve\natraso, a encantação será consumida e aplicada.\n\nAs encantações podem ter vários níveis,\naumentados ao aplicar a mesma Encantação.
essences.section_beheading_content=&#5b0001&lDecapitação&r\n&oAumenta as taxas de drop de cabeças\n\n&r&lAplica-se a: &respadas, machados, maças,\ntridentes e lanças\n\n&r&lJogadores: &r25% no I, 50% no II, 75% no III\n\n&r&lMobs: &r10% no I, 20% no II, 30% no III
essences.section_lifesteal_content=&a&lRoubo de Vida&r\n\n&oCura a partir do dano causado. Requer um\n&6Lingote de Aranarthium &r&o\n\n&r&lAplica-se a: &respadas, machados, maças,\ntridentes, lanças\n\n- 15% de cura no I\n- 30% de cura no II\n- 50% de cura no III
essences.section_plentiful_content=&6&lAbundante&r\n\n&oTamanho de colheita de bloco aumentado. Requer um\n&6Lingote de Aranarthium &r&o\n\n&r&lAplica-se a: &rpicaretas, machados, pás, enxadas\n\n&o**Apenas um nível
essences.section_magnetism_content=&8&lMagnetismo&r\n\n&oAtrai itens colhidos para ti. Requer um\n&6Lingote de Aranarthium &r&o\n\n&r&lAplica-se a: &rpicaretas, machados, pás, enxadas\n\n&o**Apenas um nível
essences.section_resilience_content=&#8090a5&lResiliência&r\n\n&oTorna o seu item indestrutível\n\n&r&lAplica-se a: &rqualquer ferramenta, arma ou armadura\n\n- Os itens têm durabilidade infinita\n- Indestrutível por fogo e lava\n&o**Apenas um nível
essences.section_preservation_content=&5&lPreservação&r\n\n&oRecolha de blocos não colhíveis.\nRequer um &6Lingote de Aranarthium &r&o\n\n&r&lAplica-se a: &rpicaretas (sem Fortuna)\n\n&o**Apenas 3 usos\n&o**Apenas um nível
# ------------------------------------------------------------
# Rules guide
# ------------------------------------------------------------
rules.guide_title=&8      - - - &6&lRegras de Aranarth &8- - -
rules.guide_back=&8[&c<< Menu de Ajuda&8]
rules.rule_1=&8[&61&8] &eTrata todos com respeito. Assédio,\ndiscriminação, bullying ou ataques pessoais\nnão são tolerados
rules.rule_2=&8[&62&8] &7Não faças spam no chat nem o perturbes\nintentionalmente com caps excessivos, inundação de chat,\nou comportamento semelhante
rules.rule_3=&8[&63&8] &eMantem o chat apropriado para uma comunidade 13+.\nPalavrões excessivos, discussões sexuais,\nconteúdo gráfico, ou outras conversas inapropriadas\nnão são permitidas
rules.rule_4=&8[&64&8] &7Mantém apelidos, skins, construções e nomes\nde itens apropriados. Conteúdo ofensivo ou\nexplícito é proibido
rules.rule_5=&8[&65&8] &eMantem a destruição durante as raids de Dominion\nlimitada. A destruição deliberada ou excessiva\nde blocos de Dominion é proibida
rules.rule_6=&8[&66&8] &7Não danifiques desnecessariamente nem\nentulhes o overworld. Usa o Mundo Resource para\nrecolha em grande escala
rules.rule_7=&8[&67&8] &eNão uses hacks, exploits, ou qualquer coisa\nque proporcione uma vantagem injusta
rules.rule_8=&8[&68&8] &7Apenas mods do lado do cliente aprovados pelo\nConselho (staff) são permitidos. Os mods pré-aprovados\nincluem OptiFine, Shaders, MiniHUD,\nLitematica e Minimapas
rules.rule_9=&8[&69&8] &eRespeita o Conselho e as decisões de\nmoderação. Não te faças passar por staff nem\ninterfiiras intentionalmente com a moderação
rules.rule_10=&8[&610&8] &7Não cries construções ou\nfazendas que causem lag. O Conselho pode remover qualquer\nconstrução que cause lag
