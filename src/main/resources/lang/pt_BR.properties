dominions.section_intro_content=&2&lDominios\n\n&rUm Dominio é uma reivindicação de terra\nque protege uma região do mundo\nde estranhos.\n\nFunda um com &a/dominion found <nome>&r.\nO fundador torna-se o &oLíder&r.\n\nOs Dominios crescem do Nível 1 ao 5, cada\num desbloqueando funcionalidades adicionais\ncomo postos avançados, lotes e defensores.
dominions.section_claiming_content=&7&lReivindicar Terra\n\n&rReivindica o chunk em que estás com\n&a/dominion claim&r. Cancela com\n&a/dominion unclaim&r.\n\nO teu Dominio pode reivindicar até\n&e25 chunks por membro&r.\n\nTodos os chunks reivindicados são protegidos:\nsó membros com as permissões corretas\npodem construir, interagir ou entrar livremente.
dominions.section_food_content=&e&lComida & Poder\n\n&rO teu Dominio consome comida de prestígio\ndiariamente. Níveis mais altos consomem mais:\n- &7Nível 1: &e13 poder/dia\n- &7Nível 2: &e25 poder/dia\n- &7Nível 3: &e45 poder/dia\n- &7Nível 4: &e70 poder/dia\n- &7Nível 5: &e100 poder/dia\n\nValores de poder dos alimentos:\n- &6Maçã Dourada Encantada / Bolo: &e500\n- &6Fardo de Feno: &e50\n- &6Cenoura Dourada: &e10\n- &6Biscoito: &e1\n\nSe o Dominio ficar sem comida, é multado\nentre $12 e $2.000 por dia conforme o nível.
dominions.section_members_content=&7&lMembros & Ranks\n\n&rConvida um jogador com &a/dominion invite <jogador>&r.\n\nOs membros têm um de quatro ranks:\n- &6&lLíder&r - Controlo total\n- &7&lClero&r - Acesso administrativo\n- &7&lCidadão&r - Membro padrão\n- &7&lNoviço&r - Acesso limitado\n\nGere ranks com &a/dominion rank <jogador> <rank>&r.\n\nControla o que cada rank pode fazer via\n&a/dominion permissions&r, com substituições\npor jogador opcionais.
dominions.section_flags_content=&7&lBandeiras\n\n&rAs bandeiras controlam como os estranhos\ninteragem com o teu Dominio. Alterna-as com\n&a/dominion flags&r.\n\nBandeiras disponíveis:\n- &oBending&r - permitir/negar bending dentro\n- &oPvP&r - permitir/negar combate entre jogadores\n- &oSpawn de Mobs&r - permitir/negar spawns\n- &oExplosões&r - permitir/negar danos a blocos\n\nAs bandeiras dos postos avançados são\nconfiguradas independentemente do Dominio.
dominions.section_plots_content=&7&lLotes\n\n&rOs lotes dividem o teu Dominio em sub-zonas\nque podem ser atribuídas a jogadores específicos.\nRequer &oNível 2+&r.\n\nCriar um lote: &a/dominion plot create <nome>&r\nReivindicar um lote: &a/dominion plot claim <nome>&r\nAdicionar membro: &a/dominion plot add <nome> <jogador>&r\n\nJogadores atribuídos a um lote podem construir\ne interagir nesse chunk específico.
dominions.section_resources_content=&a&lRecursos\n\n&rOs recursos do Dominio são recompensas\nbaseadas em biomas que se acumulam semanalmente.\n\nUsa &a/dominion resources&r para ver a tua\nreserva atual de recursos.\n\nOs recursos acumulam-se até um &ecap de 16 semanas&r\nantes de pararem de crescer. Gasta-os\nregularmente para não atingir o limite.
dominions.section_outposts_content=&7&lPostos Avançados\n\n&rOs postos avançados são reivindicações de terra\nseparadas que podem ser colocadas em qualquer\nlugarem do mundo, com bandeiras próprias.\n\nSlots de postos avançados desbloqueiam com o nível:\n- &7Nível 2: &e1 posto avançado\n- &7Nível 3: &e2 postos avançados\n- &7Nível 4: &e3 postos avançados\n- &7Nível 5: &e4 postos avançados\n\nGere com &a/dominion outpost&r.
dominions.section_defenders_content=&4&lDefensores\n\n&rDefensores são guardas mob compráveis que\nprotegem o teu Dominio de inimigos.\n\nTipos disponíveis:\n- &cZombie&r - 50 corações, corpo a corpo\n  Resistance III, $10.000\n- &7Esqueleto&r - 25 corações, à distância\n  Speed III + Resistance I, $10.000\n\nLimites por nível do Dominio:\n&7N1: &e5 &7| N2: &e15 &7| N3: &e30 &7| N4: &e60 &7| N5: &e100\n\nCompra via &a/dominion defenders&r.\nVende por 25% do preço de compra.
dominions.section_relationships_content=&d&lRelações\n\n&rOs Dominios podem formar relações diplomáticas:\n\n- &5Aliado&r - Membros têm acesso a portas\n  e contentores do Dominio aliado\n- &dTrégua&r - Sem fogo amigo entre membros\n- &7Neutro&r - Sem acesso especial, pacífico\n- &cInimigo&r - PvP total entre membros\n  em qualquer parte do servidor\n\nGere relações via &a/dominion&r.
dominions.section_conquering_content=&c&lConquista\n\n&rOs Dominios podem tentar conquistar outros.\nInicia uma conquista com &a/dominion conquer <nome>&r.\n\nDurante a conquista:\n- A penalidade de morte é &e3x normal\n- O consumo de comida é &e12x normal\n- O alvo tem &e7 dias&r para se render\n  ou sobreviver\n\nO alvo usa &a/dominion surrender&r para ceder.\n\nOutros comandos:\n- &a/dominion rebel&r - Iniciar uma rebelião\n- &a/dominion retreat&r - Terminar a conquista\n\nTodas as ações de conquista têm &e3 dias de espera&r.
dominions.section_levels_content=&6&lNíveis do Dominio\n\n&rO teu Dominio cresce do Nível 1 ao 5.\nAvança cumprindo 4 de 6 critérios que\ncobrem membros, chunks, comida, saldo,\nidade e relações.\n\nCada nível desbloqueia:\n- &eNível 2&r: Lotes, 1 posto avançado\n- &eNível 3&r: 2 postos avançados, mais defensores\n- &eNível 4&r: 3 postos avançados, mais defensores\n- &eNível 5&r: 4 postos avançados, defensores máx.\n\nVê o progresso em &a/dominion hub&r.
