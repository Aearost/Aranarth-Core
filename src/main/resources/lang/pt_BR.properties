calendar.solaris_desc=&#BD5745&lSolaris&r &8- &oO Solstício de Verão\n\n&rO evento Solaris ocorre durante &eSolarvór&r, o mês\nda abundância. Quando o sol atinge o seu auge,\no mundo respira com energia.\n\nTodos os jogadores recebem &oForça&r e &oSaturação&r,\nenquanto os spawns de monstros diminuem consideravelmente.\n\nO evento tem três intensidades:\n- &7Solaris Pálido&r - Força I, spawns reduzidos\n- &#BD5745Solaris&r - Força I, Saturação, menos spawns\n- &6Solaris Ascendente&r - Força II, Saturação,\n  Rapidez I e spawns mínimos
calendar.lunaris_desc=&#2C041C&lLunaris&r &8- &oO Solstício de Inverno\n\n&rO evento Lunaris surge durante &8Obscurvór&r, o mês\nmais escuro do ano. O pouco de luz que resta\né engolido pelo vazio.\n\nOs spawns de monstros aumentam drasticamente e os\njogadores não conseguem dormir durante a noite.\nIntensidades mais altas trazem &oCegueira&r aleatória.\n\nO evento tem três intensidades:\n- &7Lunaris Crescente&r - spawns duplicados\n- &#2C041CLunaris&r - spawns triplicados, Fraqueza à noite\n- &8Lunaris Obscura&r - spawns quadruplicados,\n  Fraqueza e Cegueira
calendar.comet_desc=&#ff4500&lCometa de Seiko&r &8- &oA Tempestade de Fogo\n\n&rO Cometa de Seiko atravessa o céu durante\n&cArdorvór&r, o mês das chamas. O céu arde com\nrastros de fogo e brasa.\n\nOs flamejadores recebem dano significativamente\nmelhorado e acesso a habilidades de sub-elemento\ncomo &oRelâmpago&r e &oCombustão&r durante o evento.\n\nO evento tem três intensidades:\n- &#ff4500Brasa de Seiko&r - +50% de dano de flamejamento\n- &#ff4500Cometa de Seiko&r - +100% de dano de flamejamento\n- &#ff4500Conflagração de Seiko&r - +150% de dano de flamejamento
calendar.bluemoon_desc=&3&lLua Azul de Leiks&r &8- &oA Maré Ascendente\n\n&rA Lua Azul de Leiks surge durante &3Aquinvór&r, o mês\númido da primavera. A lua cheia puxa as marés\ne os mares começam a agitar-se.\n\nOs aguadobradores recebem dano significativamente\nmelhorado e acesso a habilidades de sub-elemento\ncomo &oDobragem do Sangue&r e &oDobragem de Plantas&r.\n\nO evento tem três intensidades:\n- &3Meia Lua de Leiks&r - +50% de dano de aguadobragem\n- &3Lua Azul de Leiks&r - +100% de dano de aguadobragem\n- &3Lua Marítima de Leiks&r - +150% de dano de aguadobragem
calendar.convergence_desc=&#d1e5f4&lConvergência Harmônica&r &8- &oO Despertar Espiritual\n\n&rA Convergência Harmônica de Sachsi desce durante\n&#d1e5f4Ventivór&r, quando o mundo espiritual se aproxima\nmais do plano material.\n\nOs aerodobradores recebem dano significativamente\nmelhorado e acesso a habilidades de sub-elemento\ncomo &oProjeção Astral&r e &oSom&r durante o evento.\n\nO evento tem três intensidades:\n- &#d1e5f4Sintonia de Sachsi&r - +50% de dano de aerodobragem\n- &#d1e5f4Confluência de Sachsi&r - +100% de dano de aerodobragem\n- &#d1e5f4Convergência Harmônica&r - +150% de dano de aerodobragem
calendar.meteorite_desc=&#a17100&lMeteorito de Aearost&r &8- &oO Grande Impacto\n\n&rO Meteorito de Aearost atravessa o céu durante\n&#a17100Follivór&r, marcando o início do outono com um\nestrondo sentido em toda a terra.\n\nOs terrodobradores recebem dano significativamente\nmelhorado e acesso a habilidades de sub-elemento\ncomo &oMetaldobragem&r e &oLavadobragem&r durante o evento.\n\nO evento tem três intensidades:\n- &#a17100Fragmento de Aearost&r - +50% de dano de terrodobragem\n- &#a17100Meteorito de Aearost&r - +100% de dano de terrodobragem\n- &#a17100Bólido de Aearost&r - +150% de dano de terrodobragem
