economy.section_intro_content=&e&lEconomia\n\n&rA economia de Aranarth usa &6ACoins&r,\nganhos através de empregos, missões e comércio.\n\nGasta o teu dinheiro em upgrades de rank,\ncomida de prestígio para o teu Dominio,\nlojas de jogador e muito mais.\n\nUsa &a/bal&r para verificar o teu saldo\ne &a/pay <jogador> <quantia>&r para transferir.
economy.section_jobs_content=&e&lEmpregos\n\n&rOs empregos pagam-te ACoins por realizares\ntarefas no jogo. Escolhe entre 9 empregos:\n&7Construtor, Agricultor, Mineiro, Escavador,\nMadeireiro, Ferreiro, Explorador, Alquimista,\nCaçador\n\nEmpregos ativos: &e1&r no Camponês, até\n&e5&r no Imperador conforme o rank cresce.\n\nOs empregos ganham XP conforme ganhas dinheiro.\nSubir de nível aumenta o multiplicador de\npagamento desse emprego (até 10x no nível 10).\n\nGere com &a/jobs&r.
economy.section_quests_content=&6&lMissões\n\n&rAs missões são objetivos diários e semanais\natribuídos pelo NPC &oMestre das Missões&r.\n\n- &eMissões diárias&r - reiniciam a cada dia de Aranarth\n- &6Missões semanais&r - reiniciam a cada semana\n\nCompleta missões para ACoins, XP de\nemprego bónus e outras recompensas.\n\nVisita o NPC Mestre das Missões para aceitar\ne acompanhar as tuas missões. Usa\n&a/quests&r para ver a tua lista atual.
economy.section_shopoverview_content=&a&lLojas de Jogador\n\n&rAs lojas de jogador requerem &5rank Barão ou superior&r\npara criar. O número de lojas escalona\ncom o teu rank:\n- &5Barão&r: 3 lojas\n- &8Conde&r: 7 lojas\n- &6Duque&r: 15 lojas\n- &bPríncipe&r: 30 lojas\n- &9Rei&r: 50 lojas\n- &4Imperador&r: Ilimitadas\n\nAs lojas existem na tua &oilha de loja&r no\nmundo Shops. Cria a tua com &a/shop create&r.
economy.section_shopcreation_content=&7&lCriar um Sinal de Loja\n\n&rOs sinais de loja vão na &oface frontal de um baú&r.\nColoca um Sinal de Parede e escreve:\n\n&8Linha 1: &e[Shop]\n&8Linha 2: &equantidade &7(ex. &e1&7 ou &e64&7)\n&8Linha 3: &epreço &7(ver abaixo)\n&8Linha 4: &e(deixa em branco)\n\nFormatos de preço na Linha 3:\n- &eB <preço>&r - só comprar\n- &eS <preço>&r - só vender\n- &eB <preço> / S <preço>&r - ambos\n\nO item da loja é o primeiro item no baú.\nAgachar + clique direito num sinal existente para editar.
economy.section_shopusage_content=&7&lComprar & Vender\n\n&rClique direito num sinal de loja para comprar\nou vender. Aparecerá um menu mostrando o preço\ne se a loja compra, vende ou ambos.\n\nPara transações em massa, segura &oShift&r e\nclica com o botão direito no sinal para comprar\nou vender a quantidade máxima de uma vez.\n\nPrecisas de fundos suficientes para comprar, e\no dono da loja precisa de fundos suficientes\npara pagar pelos itens que vendes.
economy.section_shopcommands_content=&7&lComandos de Loja\n\n&rSub-comandos úteis de &a/shop&r:\n- &a/shop create&r - Criar a tua ilha de loja\n- &a/shop&r - Teleportar para a tua ilha de loja\n- &a/shop sethome&r - Atualizar localização da loja\n- &a/shop invite <jogador>&r - Adicionar colaborador\n- &a/shop leave&r - Sair da loja de outro jogador\n- &a/shop destroy&r - Eliminar permanentemente um sinal\n\nVisita a loja de outro jogador com &a/shop <nome>&r.
economy.section_shoplisting_content=&7&lListagem de Lojas\n\n&rUm diretório centralizado de listagem\nde lojas está a caminho, permitindo-te\nnavegar por todas as lojas disponíveis\ne ver o que está à venda.\n\nPor enquanto, pergunta no chat ou visita\ndiretamente o mundo Shops para encontrar\no que procuras.
economy.section_trading_content=&a&lTrocas\n\n&rOs jogadores podem trocar itens\ndiretamente entre si usando o comando\n&a/trade <jogador>&r.\n\nUma janela de troca abre para ambos os\njogadores colocarem itens e ACoins nas\nsuas ofertas respetivas. Ambos os jogadores\ndevem confirmar antes da troca ser concluída.\n\nNenhum jogador pode concluir uma troca\nse ambos não tiverem pelo menos um item\nna sua oferta.
economy.section_marketprice_content=&a&lPreço de Mercado\n\n&rO sistema de preços de mercado regista\nos preços atuais de itens comuns nas lojas\nde jogadores em Aranarth.\n\nVerifica os preços com &a/market price\n<item>&r para ver o que outros jogadores\nestão a comprar e vender antes de\ncriares a tua própria loja.
