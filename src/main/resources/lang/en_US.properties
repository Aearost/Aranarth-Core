# suppress inspection "UnusedProperty" for whole file
# ============================================================
# AranarthCore - English Language File (en_US)
# ============================================================
# Color codes: use & syntax (e.g. &7 = gray, &e = yellow, &c = red, &a = green)
# Parameters: use {name} placeholders, passed from Java as pairs
# Changing a key here changes the message on ALL servers at next reload
# ============================================================
#
# Available placeholders (all {XXX} tokens used across this file):
#
# Common placeholders (used across 5+ keys):
#   {amount}      - numeric amount (money, items, vote points, etc.)
#   {boost}       - stat boost value
#   {color}       - color name or code
#   {cost}        - price or cost value
#   {count}       - generic count (jobs, streaks, keys, etc.)
#   {dominion}    - dominion name
#   {item}        - item display name
#   {job}         - job display name
#   {level}       - level number
#   {name}        - player name, item name, or generic name
#   {number}      - generic numeric value
#   {other}       - other player name
#   {outpost}     - outpost name
#   {owner}       - owner player name
#   {pet}         - pet or mount type name
#   {player}      - player name (primary target)
#   {plot}        - plot name
#   {rank}        - rank display name
#   {reason}      - ban/warn/unmute reason
#   {recipe}      - recipe name
#   {target}      - target player name
#   {time}        - formatted time string
#   {type}        - entity or item type
#   {word}        - unscramble word
#
# Limited placeholders (used in 1-4 keys):
#   {ability}     - bending ability name
#   {action}      - action label (e.g. "left-click")
#   {article}     - grammatical article ("a" / "an")
#   {biome}       - biome display name
#   {chunks}      - number of land chunks
#   {command}     - command string
#   {conqueror}   - name of conquering player or dominion
#   {crate}       - crate type name
#   {current}     - current value (level, amount, etc.)
#   {days}        - number of days
#   {defender}    - defender type name
#   {dominionName}- dominion name (alternate param name used in some keys)
#   {duration}    - ban/mute duration string
#   {element}     - bending element name
#   {enchant}     - enchantment name
#   {enchantment} - enchantment name (alternate param name)
#   {feature}     - feature name
#   {field}       - field or column label
#   {food}        - food item name
#   {from}        - source location or server name
#   {holder}      - inventory/container holder name
#   {home}        - home name
#   {horn}        - horn type name
#   {hours}       - number of hours
#   {icon}        - icon character or symbol
#   {intensity}   - effect intensity level
#   {label}       - UI label string
#   {levels}      - plural levels count
#   {limit}       - cap or limit value
#   {list}        - formatted list string
#   {max}         - maximum value
#   {message}     - message content
#   {minutes}     - number of minutes
#   {mode}        - mode name (e.g. "enabled" / "disabled")
#   {multiplier}  - XP or reward multiplier
#   {old}         - previous value (before change)
#   {perk}        - perk display name
#   {player1}     - first player in a two-player context
#   {player2}     - second player in a two-player context
#   {preset}      - gradient preset name
#   {price}       - shop or economy price
#   {quantity}    - item quantity
#   {rebel}       - rebel player or dominion name
#   {relation}    - dominion relation label (e.g. "ally", "neutral")
#   {reward}      - reward description or amount
#   {seconds}     - number of seconds
#   {sender}      - sender player name
#   {server}      - server name
#   {skill}       - mcMMO skill name
#   {suffix}      - chat suffix string
#   {ticks}       - number of server ticks
#   {total}       - total count or balance
#   {usage}       - command usage syntax
#   {value}       - generic value
#   {volume}      - sound volume level
#   {world}       - world name
#   {x}           - X coordinate
#   {xp}          - experience points
#   {y}           - Y coordinate
#   {yield}       - resource yield amount
#   {z}           - Z coordinate
# ============================================================
