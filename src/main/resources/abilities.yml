# ==================== Air - Sound ====================

# Debuff applied by most Sound abilities on hit (20 ticks = 1 second)
SoundDebuff:
  SlownessDurationTicks: 60
  DarknessDurationTicks: 40

SonicBoom:
  # Damage scales from MaxDamage at point-blank down to MinDamage at max range
  MaxDamage: 12.0
  MinDamage: 2.0
  Cooldown: 8000
  ChargeDuration: 1000
  Range: 10.0
  HitRadius: 2.0
  # Blocks travelled per tick
  Speed: 1.5

DeafeningScream:
  # 14 damage = 7 hearts
  Damage: 14.0
  # Fraction of damage lost at the edge of the radius
  MaxFalloff: 0.5
  Cooldown: 15000
  ChargeDuration: 2000
  Radius: 7.0
  SlownessDurationTicks: 150
  DarknessDurationTicks: 100

SonicClap:
  # Damage against players, multiplied by MobDamageMultiplier against mobs
  Damage: 3.0
  MobDamageMultiplier: 1.5
  Cooldown: 2250
  Range: 12.0
  # Blocks travelled per tick
  Speed: 1.5
  HitRadiusHorizontal: 1.2
  HitRadiusVertical: 1.55

Amplification:
  Cooldown: 8000
  ChargeDuration: 5000
  # How long the amplification lasts - the multiplier decreases to 1x over this time
  Duration: 8000
  MaxMultiplier: 3.0

SonicPulse:
  Cooldown: 6000
  Range: 10.0
  Pulses: 4
  # Time over which all pulses are emitted
  Duration: 2500
  # Damage against players scales from MaxDamage on the first pulse to MinDamage on the last
  MaxDamage: 6.0
  MinDamage: 2.0
  MobDamageMultiplier: 1.5
  MinKnockback: 0.5
  MaxKnockback: 2.8
  KnockbackVertical: 0.4
  HitThickness: 0.6
  # Blocks travelled per tick
  Speed: 1.6
  # The caster recoils when a pulse hits a solid block within this distance
  MaxRecoilDistance: 4.0
  RecoilHorizontal: 1.5
  RecoilVertical: 0.6

