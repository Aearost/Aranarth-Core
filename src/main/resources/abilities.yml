# AranarthCore ability values
# All durations and cooldowns are in milliseconds unless the key ends in Ticks (20 ticks = 1 second)
# All distances are in blocks, and 2 damage = 1 heart
# Run /ac reload to apply changes - abilities that are already active keep the values they were started with
# This file is separate on each server, so keep it identical on Survival and SMP

# ==================== Fire - Lightning ====================

Jolt:
  Damage: 3.0
  Cooldown: 4000
  Range: 45.0
  StunChance: 0.5
  StunDuration: 1500
  ChargeDuration: 500
  Speed: 4.0
  HitRadius: 0.8

