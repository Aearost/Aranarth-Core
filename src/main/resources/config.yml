    admin: "1436842548412027011"

economy:
  # Cost in dollars to create a Dominion.
  dominion-creation-cost: 5000.0
  # Cost to rank up, indexed by current rank (index 0 = Peasant→Esquire, index 7 = King→Emperor).
  rankup-costs:
    - 1000.0      # Rank 0 → 1 (Esquire)
    - 5000.0      # Rank 1 → 2 (Knight)
    - 15000.0     # Rank 2 → 3 (Baron/Baroness)
    - 50000.0     # Rank 3 → 4 (Count/Countess)
    - 125000.0    # Rank 4 → 5 (Duke/Duchess)
    - 500000.0    # Rank 5 → 6 (Prince/Princess)
    - 2500000.0   # Rank 6 → 7 (King/Queen)
    - 10000000.0  # Rank 7 → 8 (Emperor/Empress)
  # Cost to recover a Reaper Inventory, indexed by current rank (0 = Peasant, 8 = Emperor/Empress).
  reaper-costs:
    - 500.0       # Rank 0 (Peasant)
    - 2000.0      # Rank 1 (Esquire)
    - 5000.0      # Rank 2 (Knight)
    - 15000.0     # Rank 3 (Baron/Baroness)
    - 30000.0     # Rank 4 (Count/Countess)
    - 100000.0    # Rank 5 (Duke/Duchess)
    - 400000.0    # Rank 6 (Prince/Princess)
    - 700000.0    # Rank 7 (King/Queen)
    - 1000000.0   # Rank 8 (Emperor/Empress)

mcmmo:
  # Minimum total mcMMO power level required to rank up, indexed by current rank.
  total-level-requirements:
    - 100    # Rank 0
    - 250    # Rank 1
    - 500    # Rank 2
    - 1000   # Rank 3
    - 2500   # Rank 4
    - 7500   # Rank 5
    - 12500  # Rank 6
    - 25000  # Rank 7
    - 50000  # Rank 8+ (default)
  # Minimum mcMMO level required in each of the three skill categories (Gathering, Combat, Misc),
  # indexed by current rank. 0 means no per-category requirement.
  per-category-requirements:
    - 0     # Rank 0
    - 0     # Rank 1
    - 150   # Rank 2
    - 375   # Rank 3
    - 750   # Rank 4
    - 1250  # Rank 5
    - 2500  # Rank 6
    - 5000  # Rank 7
    - 5000  # Rank 8+ (default)
  # The Enchanting child skill (level = average of Alchemy and Repair).
  # Every "min"/"max" pair scales linearly from the sub-skill's unlock level to level 1000.
  enchanting:
    bottled-knowledge:
      unlock-level: 100
      # Portion of the EXP spent that is stored in the bottle
      min-ratio: 0.25
      max-ratio: 0.75
    arcane-recall:
      unlock-level: 0
      min-chance: 0.10
      max-chance: 0.50
      # Portion of the EXP spent on the enchantment that is refunded
      min-refund: 0.10
      max-refund: 0.50
    arcane-ascension:
      unlock-level: 250
      min-chance: 0.025
      max-chance: 0.25
    purification:
      unlock-level: 250
      min-chance: 0.25
      max-chance: 1.0
      # Levels consumed per curse on the item
      max-levels-per-curse: 10
      min-levels-per-curse: 1
    distilled-wisdom:
      unlock-level: 0
      # Multiplier applied to grindstone EXP
      min-multiplier: 1.0
      max-multiplier: 4.0
      # Multiplier applied to the half of all collected EXP that is imbued into Essences, except Bottles o' Enchanting
      min-essence-multiplier: 1.0
      max-essence-multiplier: 2.0
    infinite-library:
      unlock-level: 0
      min-duration-seconds: 2.5
      max-duration-seconds: 10.0
      cooldown-seconds: 240
      lapis-per-roll: 8
      # How long the ability stays readied before it is lowered
      ready-seconds: 4
    repair-xp:
      # Repair XP per EXP level spent on an anvil (renaming alone gives none)
      per-anvil-level: 150
      # Repair XP per point of base grindstone EXP
      per-grindstone-exp: 15

players:
  # Number of seconds without movement before a player is marked AFK automatically.
  afk-timeout-seconds: 300
  # Signed skin textures shown as the heads of the tab list group dividers and blank filler rows.
  # Generate a signed single-color skin via mineskin.org. The gold skin is used for the dividers of groups with players in them,
  # and the gray skin for every other row.
  # Leave the gray skin empty to use the default Steve/Alex skins.
  tab-blank-skin:
    value: ""
    signature: ""
  tab-gold-skin:
    value: ""
    signature: ""

head-exchange:
  # Categories to fetch from the minecraft-heads.com API.
  # Valid values: blocks, food-drinks, animals, monsters, humanoid, other, decoration
  categories:
    - blocks
    - food-drinks
  # Manual material overrides for heads whose display name doesn't auto-match a Minecraft material.
  # Key = exact head name as returned by the API, Value = Bukkit Material enum name (uppercase).
  # Unmatched heads are logged to console on startup with suggested keys to add here.
  material-overrides: {}

# Cross-server network settings. Only used when is-public-server: true.
# On the test server these are ignored entirely.
network:
  # Which server this jar is running on. Must match one of the names under 'servers' below.
  # Set to "survival" on the survival server and "smp" on the SMP server.
  this-server: "survival"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: ""
    username: ""
    password: ""
  # Names must match the server names defined in your Velocity config.yml
  servers:
    survival: "survival"
    smp: "smp"

# /vc voice chat channels. Requires the Simple Voice Chat plugin on both servers.
voice-chat:
  # Direct encrypted link that carries live voice between Survival and SMP.
  link:
    enabled: false
    # Set to true on exactly ONE server. That server listens on the port below, which must be open in its firewall.
    host-mode: false
    # Only used when host-mode is false: the address of the host-mode server.
    host: ""
    # The port the host-mode server listens on (TCP). Must be the same on both servers.
    port: 24460
    # Must be identical on both servers and at least 16 characters. Keep it private.
    secret: ""
    # Only used on the host-mode server: the IP address of the other server. When set, connections from any other
    # address are refused before the handshake. Leave empty to accept any address.
    allowed-ip: ""

# Creative plots world ("creative" on the Survival server).
creative-plots:
  # Size of one plot's buildable area and the width of everything between two plots (both borders + the road), in blocks.
  # Must match plot_tile.schem if it is used (plot-size + road-width = the tile's width).
  plot-size: 100
  road-width: 11
  # Starting world border diameter, rounded down to whole rings of plots around plot 0,0. Chunky pre-generates
  # this area when the world is first created. Use /creative expand <rings> to grow it afterwards.
  border-size: 2500
  # Where /creative and /plot spawn teleport to.
  spawn:
    x: -5.5
    y: 91.0
    z: -5.5
    yaw: 180.0
    pitch: 0.0
